name: Release

# Ein Tag wie v0.1.0 baut eine signierte APK und haengt sie an ein GitHub
# Release. Von dort laden die Mitspieler sie herunter. Per Hand gestartet legt
# der Workflow das Tag selbst auf den gewaehlten Stand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v, z. B. 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus dem Tag ableiten
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          name="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version $name hat nicht die Form X.Y.Z"
            exit 1
          fi
          # Android installiert ein Update nur bei hoeherem versionCode.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Mit dem festen Schluessel aus signing-key.yml legen sich Updates ueber
      # die installierte Version. Solange es ihn nicht gibt, signiert ein
      # Wegwerf-Schluessel, der den Runner nie verlaesst - dann muss vor jedem
      # Update die alte Version deinstalliert werden.
      - name: Signierschluessel bereitstellen
        id: key
        env:
          PASS: ${{ secrets.ROTASKAT_KEYSTORE_PASSWORD }}
        run: |
          jks="$RUNNER_TEMP/release.jks"
          if [ -f app/release.jks.enc ] && [ -n "$PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:PASS \
              -in app/release.jks.enc -out "$jks"
            echo "temporary=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Kein fester Signierschluessel, signiere mit Wegwerf-Schluessel"
            PASS=$(openssl rand -hex 32)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$jks" -storetype PKCS12 \
              -alias rotaskat -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Rotaskat, C=DE" -storepass:env PASS -keypass:env PASS
            echo "temporary=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ROTASKAT_KEYSTORE_FILE=$jks" >> "$GITHUB_ENV"
          echo "ROTASKAT_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "ROTASKAT_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Abrechnungslogik testen
        run: ./gradlew :shared:test

      - name: App testen (Unit)
        run: ./gradlew :app:testDebugUnitTest

      - name: Release-APK bauen
        env:
          ROTASKAT_KEY_ALIAS: rotaskat
          ROTASKAT_SERVER_URL: ${{ secrets.ROTASKAT_SERVER_URL }}
        run: >
          ./gradlew :app:assembleRelease
          -Protaskat.versionName=${{ steps.version.outputs.name }}
          -Protaskat.versionCode=${{ steps.version.outputs.code }}

      - name: Signatur pruefen
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "rotaskat-${{ steps.version.outputs.name }}.apk"

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: Rotaskat ${{ steps.version.outputs.name }}
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: rotaskat-${{ steps.version.outputs.name }}.apk
          body: |
            ## Installieren

            1. `rotaskat-${{ steps.version.outputs.name }}.apk` unten unter **Assets** auf dem Handy herunterladen.
            2. Die Datei öffnen. Android fragt beim ersten Mal, ob der Browser bzw. die Dateien-App Apps installieren darf: erlauben.
            3. Installieren. Warnt Google Play Protect vor einer unbekannten App, auf "Trotzdem installieren" tippen.

            ${{ steps.key.outputs.temporary == 'true' && '**Testversion:** Vor dem nächsten Update muss diese Version deinstalliert werden, die gespielten Abende gehen dabei verloren.' || 'Spätere Versionen lassen sich genauso über diese installieren, die gespielten Abende bleiben erhalten.' }}

            Voraussetzung: Android 8.0 oder neuer.
