name: Release

# Ein Tag wie v0.1.0 baut eine signierte APK und haengt sie an ein GitHub
# Release. Von dort laden die Mitspieler sie herunter.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus dem Tag ableiten
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME hat nicht die Form vX.Y.Z"
            exit 1
          fi
          # Android installiert ein Update nur bei hoeherem versionCode.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Ohne festen Schluessel laesst sich ein spaeteres Update nicht ueber
      # die alte Version installieren. Lieber hier abbrechen als eine APK mit
      # Wegwerf-Schluessel verteilen.
      - name: Signierschluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ROTASKAT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ROTASKAT_KEYSTORE_BASE64 fehlt"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ROTASKAT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Abrechnungslogik testen
        run: ./gradlew :shared:test

      - name: App testen (Unit)
        run: ./gradlew :app:testDebugUnitTest

      - name: Release-APK bauen
        env:
          ROTASKAT_KEYSTORE_PASSWORD: ${{ secrets.ROTASKAT_KEYSTORE_PASSWORD }}
          ROTASKAT_KEY_ALIAS: ${{ secrets.ROTASKAT_KEY_ALIAS }}
          ROTASKAT_KEY_PASSWORD: ${{ secrets.ROTASKAT_KEY_PASSWORD }}
          ROTASKAT_SERVER_URL: ${{ secrets.ROTASKAT_SERVER_URL }}
        run: >
          ./gradlew :app:assembleRelease
          -Protaskat.versionName=${{ steps.version.outputs.name }}
          -Protaskat.versionCode=${{ steps.version.outputs.code }}

      - name: Signatur pruefen
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "rotaskat-${{ steps.version.outputs.name }}.apk"

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: Rotaskat ${{ steps.version.outputs.name }}
          prerelease: true
          files: rotaskat-${{ steps.version.outputs.name }}.apk
          body: |
            ## Installieren

            1. `rotaskat-${{ steps.version.outputs.name }}.apk` unten unter **Assets** auf dem Handy herunterladen.
            2. Die Datei öffnen. Android fragt beim ersten Mal, ob der Browser bzw. die Dateien-App Apps installieren darf: erlauben.
            3. Installieren. Warnt Google Play Protect vor einer unbekannten App, auf "Trotzdem installieren" tippen.

            Spätere Versionen lassen sich genauso über diese installieren, die gespielten Abende bleiben erhalten.

            Voraussetzung: Android 8.0 oder neuer.
